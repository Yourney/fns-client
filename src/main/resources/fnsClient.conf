# JMS Config
jms {
  initialContextFactory = "com.solacesystems.jndi.SolJNDIInitialContextFactory"
  providerUrl = "JMS_PROVIDER_URL"
  username = "JMS_USERNAME"
  password = "JMS_PASSWORD"
  solace {
    messageVpn = "SCDS_MESSAGE_VPN"
    sslTrustStore = "cacerts"
    jndiConnectionRetries = -1
  }
  connectionFactory = "CONNECTION_FACTORY_NAME"
  destination = "QUEUE_NAME"
  messageProcessor {
    processingThreads = 4
  }
}

# FIL Config
fil {
  sftp {
    host = "YOUR_FIL_HOST"
    port = 22
    username = "YOUR_FIL_USERNAME"
    strictHostKeyChecking = "no"
    knownHostsFilePath = ""
    certFilePath = "PATH/TO/FIL/AUTH/CERT"
    filFileSavePath = "YOUR_DOWNLOAD_DIRECTORY"
  }
}

# Database Config (H2)
notamDb {
  driver = "org.h2.Driver"
  connectionUrl = "jdbc:h2:./Notams;mode=MySQL;AUTO_SERVER=TRUE"
  username = ""
  password = ""
  schema = "PUBLIC"
  table = "NOTAMS"
}

# Missed Message Tracker Config
messageTracker {
  scheduleRate = 10  # seconds
  missedMessageTriggerTime = 5  # minutes
  staleMessageTriggerTime = 10  # minutes
}

# REST API
restapi {
  enabled = true
  port = 8080
}
